[package]
name = "recurse-control-voltage"
version = "0.2.0"
edition = "2024"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
cyw43 = { version = "0.7.0", features = ["defmt"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
defmt = "1.0.1"
defmt-rtt = "1.1.0"
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-net = { version = "0.9.1", features = [
  "defmt",
  "proto-ipv4",
  "medium-ethernet",
  "tcp",
  "udp",
  "dhcpv4",
] }
embassy-rp = { version = "0.10.0", features = [
  "time-driver",
  "critical-section-impl",
  "rp235xa",
  "binary-info",
  "defmt",
] }
embassy-time = { version = "0.5.1" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"

[build-dependencies]
dotenvy = "0.15.7"
